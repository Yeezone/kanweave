# KanWeave bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:<repo>`.
#
# The row is a bare plugin by package name: the node half (exports ".")
# registers the `/kanweave/*` HTTP routes in the host process, and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI
# as a sidebar entry plus a full-height board page.
- insert:
    - id: ui-kanweave
      name: 'dsh-kanweave'
